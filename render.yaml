databases:
  - name: locus-db
    plan: free
    databaseName: locus
    user: locus

services:
  - type: web
    name: locus-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: LOCUS_DATABASE_URL
        fromDatabase:
          name: locus-db
          property: connectionString
      - key: LLM_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Sign-in gate. sync: false keeps the value out of the repo — set it in
      # the dashboard under Environment. Leave it unset and the API stays open.
      - key: LOCUS_AUTH_PASSWORD
        sync: false
      - key: LOCUS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: locus-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://locus-backend-ewwe.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
